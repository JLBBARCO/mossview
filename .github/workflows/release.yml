name: Automated Release

on:
    push:
        branches:
            - main
            - beta
        paths-ignore:
            - "legado/**"

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  sparse-checkout-cone-mode: false
                  sparse-checkout: |
                      /*
                      !/legado/

            - name: Prepare release version
              id: version
              env:
                  BRANCH_NAME: ${{ github.ref_name }}
              run: |
                  python .github/scripts/prepare_release.py \
                    "$BRANCH_NAME" .github/version.txt pyproject.toml

            - name: Commit updated version
              run: |
                  if git diff --quiet -- .github/version.txt pyproject.toml; then
                    echo "Version is already synchronized."
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add .github/version.txt pyproject.toml
                  git commit -m "chore(release): update version to ${{ steps.version.outputs.version }} [skip ci]"
                  git push

            - name: Build package
              run: |
                  python -m pip install --upgrade build
                  python -m build

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ steps.version.outputs.version }}
                  PRERELEASE: ${{ steps.version.outputs.prerelease }}
              run: |
                  args=( "v$VERSION" dist/* --generate-notes )
                  if [ "$PRERELEASE" = "true" ]; then
                    args+=( --prerelease )
                  fi
                  gh release create "${args[@]}"
