name: Publish to PyPI

on:
    release:
        types: [published] # Dispara automaticamente sempre que você cria uma "Release" no GitHub

jobs:
    pypi-publish:
        name: Upload release to PyPI
        runs-on: ubuntu-latest

        # Configurações de permissão exigidas pelo Trusted Publishers (OIDC)
        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  sparse-checkout-cone-mode: false
                  sparse-checkout: |
                      /*
                      !/legado/

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.x"

            - name: Install build dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install build

            - name: Build binary wheel and source tarball
              run: python -m build

            - name: Publish package to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
